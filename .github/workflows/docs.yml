name: Generate Markdown Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 3.x でも良いが明示的に指定する方が安定

      # 3. 依存関係をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdoc

      # 4. docs フォルダを作成
      - name: Create docs folder if not exists
        run: mkdir -p docs

      # 5. Markdown ドキュメントを生成
      - name: Generate Markdown docs
        run: |
          pdoc --markdown --output-dir docs ./cogs


      # 6. docs フォルダをコミットしてプッシュ
      - name: Commit and push docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Update generated docs" || echo "No changes to commit"
          git push
