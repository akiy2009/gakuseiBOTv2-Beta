name: Build Markdown Docs from /cogs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-markdown-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pdoc  # Markdown ドキュメント生成用

      - name: Generate Markdown docs from /cogs
        run: |
          mkdir -p docs_markdown
          python -m pdoc --output-dir docs_markdown --format markdown cogs