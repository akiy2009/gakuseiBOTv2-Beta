name: Generate Markdown Docs for cogs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pdoc
        run: |
          pip install --upgrade pip
          pip install pdoc>=14.0.0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate Markdown docs for ./cogs
        run: |
          mkdir -p docs
          # pdoc v14以降は -o と --output-dir が同じ意味です
          # Markdown形式を指定するなら --template-dir ではなく --renderer を使います
          # ただしpdoc14はMarkdown出力がデフォルトではないので
          # 下記のように --renderer markdown を明示します
          pdoc --output-dir docs -- markdown ./cogs
