name: Build project documentation

on:
  push:
    branches: [main]
    paths:
      - "cogs/**/*.py"
      - "main.py"
      - "scripts/**"
      - ".env.example"
      - "tests/test_documentation_generator.py"
      - "docs/**"
      - "requirements*.txt"
      - "README.md"
      - ".python-version"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "cogs/**/*.py"
      - "main.py"
      - "scripts/**"
      - ".env.example"
      - "tests/test_documentation_generator.py"
      - "docs/**"
      - "requirements*.txt"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-docs.txt

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q main.py cogs

      - name: Generate source-driven references
        run: python scripts/generate_docs.py

      - name: Test documentation generator
        run: python -m pytest -q tests/test_documentation_generator.py

      - name: Build manual documentation
        run: sphinx-build -W --keep-going -b html docs build/manual-docs

      - name: Build Cog API documentation
        run: pdoc --output-dir build/api-docs cogs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: project-documentation
          path: |
            build/manual-docs/
            build/api-docs/
          if-no-files-found: error
          retention-days: 14
