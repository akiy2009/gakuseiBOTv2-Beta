name: Build Markdown Docs from /cogs (Robust)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-markdown-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found or failed to install"
          pip install --upgrade pdoc

      - name: Show pdoc version
        run: python -m pdoc --version

      - name: Generate Markdown docs from /cogs if exists
        run: |
          mkdir -p docs_markdown
          if [ -d "cogs" ]; then
            echo "'cogs' directory found. Generating Markdown docs..."
            python -m pdoc --output-dir docs_markdown --format markdown cogs || echo "⚠️ pdoc generation failed but continuing workflow."
          else
            echo "'cogs' directory not found. Skipping Markdown generation."
          fi

      - name: List generated docs_markdown files
        run: ls -l docs_markdown || echo "No docs_markdown directory or files found."