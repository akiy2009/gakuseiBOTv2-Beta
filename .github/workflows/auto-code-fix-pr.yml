name: Auto-fix code issues and open PR

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Keep write permissions limited to the job that creates the maintenance PR.
permissions:
  contents: read

concurrency:
  group: auto-code-fix-pr
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Detect safe fixes and prepare PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the current default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install quality and project dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply safe deterministic lint and format fixes
        id: autofix
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ruff check --fix --output-format=github .
          lint_status=$?
          ruff format .
          format_status=$?
          git diff --check
          diff_status=$?
          {
            echo "lint_status=$lint_status"
            echo "format_status=$format_status"
            echo "diff_status=$diff_status"
          } >> "$GITHUB_OUTPUT"
          if [[ "$lint_status" -ne 0 || "$format_status" -ne 0 || "$diff_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Run syntax, dependency, and test checks
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python -m compileall -q main.py cogs tests
          python -m pytest -q

      - name: Write run summary
        if: always()
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.autofix.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_STATUS: ${{ steps.autofix.outputs.lint_status }}
          FORMAT_STATUS: ${{ steps.autofix.outputs.format_status }}
          DIFF_STATUS: ${{ steps.autofix.outputs.diff_status }}
        run: |
          {
            echo "## Automated code-quality maintenance"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Ruff safe autofixes | ${LINT_OUTCOME:-not-run} (exit ${LINT_STATUS:-n/a}) |"
            echo "| Ruff formatter | ${FORMAT_STATUS:-not-run} |"
            echo "| Whitespace validation | ${DIFF_STATUS:-not-run} |"
            echo "| Dependency, syntax and tests | ${TEST_OUTCOME:-not-run} |"
            echo
            echo "Only deterministic Ruff fixes and formatting are applied. No automatic merge is performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an assigned pull request
        if: always() && steps.autofix.outcome != 'skipped'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/auto-code-quality-fixes
          delete-branch: false
          commit-message: "chore: apply safe automated Python quality fixes"
          title: "chore: automated safe code-quality fixes"
          assignees: akiy2009
          draft: ${{ steps.autofix.outcome != 'success' || steps.tests.outcome != 'success' }}
          body: |
            ## Automated code-quality maintenance

            This PR is created by the Auto-fix code issues workflow.

            - **Scope:** Ruff's deterministic lint autofixes and formatting only; no arbitrary application-logic rewrites.
            - **Lint/autofix step:** ${{ steps.autofix.outcome }}
            - **Ruff lint exit code:** ${{ steps.autofix.outputs.lint_status || 'not run' }}
            - **Ruff formatter exit code:** ${{ steps.autofix.outputs.format_status || 'not run' }}
            - **Whitespace validation exit code:** ${{ steps.autofix.outputs.diff_status || 'not run' }}
            - **Dependency, syntax and tests:** ${{ steps.tests.outcome }}
            - **Triggered by:** ${{ github.event_name }}
            - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the diff before merging. If lint, formatting, dependency checks, syntax checks, or tests fail, this PR remains a draft for investigation. This workflow never merges automatically.
