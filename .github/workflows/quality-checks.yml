name: Python Quality CI with Auto PR & Issue Reporting

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/quality-checks.yml'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-check:
    name: Quality Checks (Lint, Type, Test, Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Run ruff check (allow failures, save output)
        id: ruff_check
        run: |
          ruff check cogs tests > ruff_output.txt || true
          cat ruff_output.txt

      - name: Run mypy (allow failures, save output)
        id: mypy_check
        run: |
          mypy cogs > mypy_output.txt || true
          cat mypy_output.txt

      - name: Run pip-audit (allow failures, save output)
        id: pip_audit
        run: |
          pip-audit > audit_output.txt || true
          cat audit_output.txt

      - name: Check if test files exist
        id: testfiles
        run: |
          if ls tests/test_*.py tests/*_test.py 1> /dev/null 2>&1; then
            echo "TESTS_FOUND=true" >> $GITHUB_ENV
          else
            echo "TESTS_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Run tests with coverage (only if test files found)
        if: env.TESTS_FOUND == 'true'
        run: |
          coverage run -m pytest tests/
          coverage report
          coverage xml

      - name: Skip tests notice
        if: env.TESTS_FOUND == 'false'
        run: echo "No test files found, skipping tests."

      - name: Save error flags for next jobs
        run: |
          if grep -qE "error|F401|F541" ruff_output.txt; then
            echo "RUFF_ERRORS=true" >> $GITHUB_ENV
          else
            echo "RUFF_ERRORS=false" >> $GITHUB_ENV
          fi

          if grep -q "error:" mypy_output.txt; then
            echo "MYPY_ERRORS=true" >> $GITHUB_ENV
          else
            echo "MYPY_ERRORS=false" >> $GITHUB_ENV
          fi

          if grep -q "No known vulnerabilities found" audit_output.txt; then
            echo "AUDIT_ISSUES=false" >> $GITHUB_ENV
          else
            echo "AUDIT_ISSUES=true" >> $GITHUB_ENV
          fi

  auto-fix-pr:
    name: Auto Fix and PR Creation
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: pip install black ruff

      - name: Apply black formatter
        run: black cogs tests

      - name: Apply ruff auto-fixes
        run: ruff cogs tests --fix

      - name: Check for changes
        id: check_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style: automatic fixes by black and ruff"
            echo "CHANGES=1" >> $GITHUB_ENV
          else
            echo "CHANGES=0" >> $GITHUB_ENV
          fi

      - name: Create Pull Request if fixes applied
        if: env.CHANGES == '1'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: automatic fixes by black and ruff"
          branch: auto/format-fix
          title: "Automatic style fixes"
          body: |
            This PR contains automatic code style fixes by black and ruff.
          labels: auto-fix, formatting
          delete-branch: true

  issue-report:
    name: Create Issues for Remaining Errors
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Create Ruff Issue
        if: env.RUFF_ERRORS == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: '[Lint Error] Ruff detected code issues'
          content-filepath: ruff_output.txt
          labels: lint, ruff
          assignees: akiy2009

      - name: Create Mypy Issue
        if: env.MYPY_ERRORS == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: '[Type Error] Mypy detected typing issues'
          content-filepath: mypy_output.txt
          labels: type-check, mypy
          assignees: akiy2009

      - name: Create Security Audit Issue
        if: env.AUDIT_ISSUES == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: '[Security] Vulnerabilities detected by pip-audit'
          content-filepath: audit_output.txt
          labels: security, audit
          assignees: akiy2009
