name: CI Pipeline

on:
  push:
    paths:
      - "main.py"
      - "cogs/**"
      - "tests/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "main.py"
      - "cogs/**"
      - "tests/**"
      - ".github/workflows/*.yml"

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      # コードを取得
      - uses: actions/checkout@v4

      # Python 環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 必要ツールのインストール
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pip-audit

      # 1. RuffによるLintチェック
      - name: Ruff Lint Check
        run: |
          if [ ! -f main.py ] && [ ! -d cogs ]; then
            echo "### Ruff Lint Skipped" > ruff_report.md
            echo "No Python source (main.py or cogs/) found. Skipping lint." >> ruff_report.md
          else
            ruff . > ruff_output.txt || true
            if [ -s ruff_output.txt ]; then
              echo "### Ruff Lint Errors" > ruff_report.md
              echo '```' >> ruff_report.md
              cat ruff_output.txt >> ruff_report.md
              echo '```' >> ruff_report.md
            fi
          fi
        continue-on-error: true

      # Ruff Lint結果をIssueとして作成 (ファイルがあればIssue化、なければ無視)
      - name: Create Issue for Lint Errors
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Lint errors detected by Ruff"
          content-filepath: ruff_report.md
          labels: automated, lint

      # 2. Ruff & Blackによる自動フォーマット
      - name: Code Formatting (Ruff --fix + Black)
        run: |
          if [ ! -f main.py ] && [ ! -d cogs ]; then
            echo "### Formatting Skipped" > format_skip.md
            echo "No Python source found. Skipping formatting." >> format_skip.md
          else
            ruff --fix .
            black .
          fi
        continue-on-error: true

      # フォーマットがスキップされた場合にIssue作成
      - name: Create Issue for Formatting Skip
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Formatting Skipped"
          content-filepath: format_skip.md
          labels: automated, formatting

      # フォーマット変更を新規ブランチでコミットしPR作成 [oai_citation:3‡github.com](https://github.com/peter-evans/create-pull-request#:~:text=1,checked%20out%20in%20the%20workflow)
      - name: Create Pull Request for Formatting
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ":art: Format code with Ruff & Black"
          title: "Automated code formatting with Ruff & Black"
          body: |
            This PR contains automated formatting changes (Ruff and Black). Please review and merge if appropriate.
          labels: automated, formatting

      # 3. Mypyによる型チェック
      - name: Mypy Type Check
        run: |
          if [ ! -f main.py ] && [ ! -d cogs ]; then
            echo "### MyPy Skipped" > mypy_report.md
            echo "No Python source found. Skipping type check." >> mypy_report.md
          else
            mypy . > mypy_output.txt || true
            if [ -s mypy_output.txt ]; then
              echo "### MyPy Errors" > mypy_report.md
              echo '```' >> mypy_report.md
              cat mypy_output.txt >> mypy_report.md
              echo '```' >> mypy_report.md
            fi
          fi
        continue-on-error: true

      # MyPy型チェック結果をIssueとして作成
      - name: Create Issue for MyPy Errors
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Type check errors detected by MyPy"
          content-filepath: mypy_report.md
          labels: automated, type-check

      # 4. Pytestによるテスト実行
      - name: Run Pytest
        run: |
          if [ ! -d tests ]; then
            echo "### Pytest Skipped" > pytest_report.md
            echo "No tests directory found. Skipping tests." >> pytest_report.md
          else
            pytest --maxfail=1 --disable-warnings -q > pytest_output.txt || (
              echo "### Pytest Failures" > pytest_report.md
              echo '```' >> pytest_report.md
              cat pytest_output.txt >> pytest_report.md
              echo '```' >> pytest_report.md
            )
          fi
        continue-on-error: true

      # Pytest失敗・スキップをIssueとして作成
      - name: Create Issue for Pytest
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Test failures or skip report"
          content-filepath: pytest_report.md
          labels: automated, tests

      # 5. pip-auditによる依存性セキュリティスキャン
      - name: Security scan with pip-audit
        run: |
          pip-audit > pip_audit.txt || true
          if ! grep -q "No known vulnerabilities found" pip_audit.txt; then
            echo "### Security Vulnerabilities Detected" > pip_audit_report.md
            echo '```' >> pip_audit_report.md
            cat pip_audit.txt >> pip_audit_report.md
            echo '```' >> pip_audit_report.md
          fi
        continue-on-error: true

      # pip-audit結果をIssueとして作成（脆弱性があれば）
      - name: Create Issue for pip-audit
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dependency security audit report"
          content-filepath: pip_audit_report.md
          labels: automated, security