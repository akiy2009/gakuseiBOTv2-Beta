name: Python Quality CI

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

jobs:
  run-main:
    runs-on: ubuntu-latest
    outputs:
      ruff_failed: ${{ steps.ruff_check.outcome == 'failure' }}
      mypy_failed: ${{ steps.mypy_check.outcome == 'failure' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy pytest coverage pip-audit

      - name: Run ruff (lint)
        id: ruff_check
        run: |
          mkdir -p reports
          if [ -d "cogs" ]; then
            ruff check cogs tests || true
            ruff check cogs tests > reports/ruff.txt || true
          fi

      - name: Run mypy (type check)
        id: mypy_check
        run: |
          if [ -d "cogs" ]; then
            mypy cogs > reports/mypy.txt || true
          fi

      - name: Run pip-audit
        run: |
          pip-audit || true

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ]; then
            coverage run -m pytest || true
            coverage report || true
            coverage xml || true
          else
            echo "No tests directory. Skipping tests."
          fi

  report-issues:
    needs: run-main
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check and create issues if needed
        if: always()
        run: |
          mkdir -p reports
          if [ -f reports/ruff.txt ]; then
            echo "## Ruff Errors" > issue_body.md
            echo '```' >> issue_body.md
            cat reports/ruff.txt >> issue_body.md
            echo '```' >> issue_body.md
          fi
          if [ -f reports/mypy.txt ]; then
            echo "## Mypy Errors" >> issue_body.md
            echo '```' >> issue_body.md
            cat reports/mypy.txt >> issue_body.md
            echo '```' >> issue_body.md
          fi

      - name: Create Issue
        if: always() && (success() || failure()) && (steps.check.outputs.issues_needed == 'true')
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "自動コードチェックの問題点"
          body-file: issue_body.md

  auto-fix:
    needs: run-main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters
        run: |
          pip install black ruff

      - name: Run black
        run: |
          if [ -d "cogs" ]; then
            black cogs tests || true
          fi

      - name: Run ruff --fix
        run: |
          if [ -d "cogs" ]; then
            ruff check cogs tests --fix || true
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR with fixes
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: 自動整形による修正 (black & ruff)"
          branch: auto/format-fix
          title: "自動整形: black & ruff による修正"
          body: |
            この PR は GitHub Actions によって自動的に作成されました。
            - `black` によるコード整形
            - `ruff --fix` による自動修正
          labels: auto-fix, formatting