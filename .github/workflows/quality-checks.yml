name: Python Quality CI

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

jobs:
  quality-check:
    name: Quality Checks
    runs-on: ubuntu-latest
    outputs:
      had_errors: ${{ steps.set-result.outputs.had_errors }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Run ruff (lint)
        id: ruff
        run: |
          if ls cogs/**/*.py >/dev/null 2>&1; then
            ruff check cogs tests || echo "Ruff failed" > ruff_error.log
          fi

      - name: Run mypy
        id: mypy
        run: |
          if ls cogs/**/*.py >/dev/null 2>&1; then
            mypy cogs || echo "Mypy failed" > mypy_error.log
          fi

      - name: Run pip-audit
        id: audit
        run: |
          pip-audit || echo "Audit failed" > audit_error.log

      - name: Run tests
        id: test
        run: |
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then
            coverage run -m pytest || echo "Test failed" > test_error.log
            coverage report || true
          else
            echo "No tests found, skipping"
          fi

      - name: Aggregate errors
        id: set-result
        run: |
          ERRORS=false
          for f in *.log; do
            [ -f "$f" ] && ERRORS=true && break
          done
          echo "had_errors=${ERRORS}" >> $GITHUB_OUTPUT

  create-issue-if-errors:
    name: Create Issue on Errors
    needs: quality-check
    if: needs.quality-check.outputs.had_errors == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log

      - name: Create issue
        uses: peter-evans/create-issue@v3.1.0
        with:
          title: "CIでエラーが検出されました"
          body: |
            GitHub Actions の自動チェックにてエラーが検出されました。

            - Lint (ruff)
            - 型チェック (mypy)
            - テスト (pytest)
            - セキュリティチェック (pip-audit)

            詳細は [ログファイル](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) または添付ファイルを確認してください。

          labels: bug, ci, auto-detected

  auto-fix:
    name: Auto Format & PR
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters
        run: pip install black ruff

      - name: Check if code exists
        id: check-code
        run: |
          if ls cogs/**/*.py >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Format with black
        if: steps.check-code.outputs.found == 'true'
        run: black cogs tests || true

      - name: Format with ruff
        if: steps.check-code.outputs.found == 'true'
        run: ruff cogs tests --fix || true

      - name: Check git diff
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR for auto-fix
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: 自動整形 (black/ruff)"
          branch: auto/code-fix
          title: "自動整形: コードフォーマット (black/ruff)"
          body: |
            GitHub Actions によって自動でコード整形されたPRです。
            - `black`
            - `ruff --fix`
          labels: auto-fix, formatting
