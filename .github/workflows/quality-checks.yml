name: Python Quality CI + Auto Fix + Execution

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
      - 'main.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-check:
    name: Quality Checks (Lint, Type, Test, Audit)
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Lint チェック (ruff)
        run: ruff check cogs tests

      - name: 型チェック (mypy)
        run: mypy cogs

      - name: セキュリティスキャン (pip-audit)
        run: pip-audit

      - name: ユニットテスト & カバレッジ
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: main.py 実行テスト
        run: |
          if [ -f main.py ]; then python main.py; fi

      - name: 成功を Issue に通知
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "✅ main.py 実行成功" \
                          --body "main.py が正常に実行されました。\n\n実行日時: $(date +'%Y-%m-%d %H:%M:%S')" || echo "通知済みまたはエラー無視"

  auto-fix:
    name: Auto Format & PR
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 整形ツールインストール
        run: pip install black ruff

      - name: black による整形
        run: black cogs tests || true

      - name: ruff による Lint 修正
        run: ruff cogs tests --fix || true

      - name: Git 設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: PR 作成 (整形)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "style: 自動整形とLint修正 (black, ruff)"
          branch: auto/format-lint-fix
          title: "自動整形: black/ruff による修正"
          body: |
            GitHub Actions により自動作成された Pull Request です。

            - `black` によるフォーマット整形  
            - `ruff --fix` による未使用importやf-stringの修正  
            
            内容を確認のうえ、問題がなければマージしてください
          labels: auto-fix, formatting
