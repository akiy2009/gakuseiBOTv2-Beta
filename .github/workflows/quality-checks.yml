name: Python Quality CI 🛠️ Fully Robust

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'cogs/**'
      - 'tests/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  COGS_PATH: cogs
  TESTS_PATH: tests

jobs:
  quality-check:
    name: Static Checks & Tests
    runs-on: ubuntu-latest
    outputs:
      ruff_errors: ${{ steps.ruff.outputs.errors }}
      mypy_errors: ${{ steps.mypy.outputs.errors }}
      tests_skipped: ${{ steps.check_tests.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy pytest coverage pip-audit

      - name: Check existence of paths
        id: check_paths
        run: |
          echo "COGS_EXISTS=$(if [ -d "$COGS_PATH" ]; then echo true; else echo false; fi)" >> $GITHUB_ENV
          echo "TESTS_EXISTS=$(if [ -d "$TESTS_PATH" ]; then echo true; else echo false; fi)" >> $GITHUB_ENV

      - name: Ruff Lint
        id: ruff
        if: env.COGS_EXISTS == 'true'
        run: |
          ruff check $COGS_PATH $TESTS_PATH > ruff.txt || true
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          cat ruff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Mypy Type Check
        id: mypy
        if: env.COGS_EXISTS == 'true'
        run: |
          mypy $COGS_PATH > mypy.txt || true
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          cat mypy.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Security Scan
        if: env.COGS_EXISTS == 'true'
        run: pip-audit > audit.txt || true

      - name: Run Pytest & Coverage
        id: check_tests
        if: env.TESTS_EXISTS == 'true'
        run: |
          coverage run -m pytest || true
          coverage report || true
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Skip Pytest if none
        if: env.TESTS_EXISTS != 'true'
        id: check_tests
        run: echo "skip=true" >> $GITHUB_OUTPUT

  auto-fix:
    name: Auto Format & PR
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: pip install black ruff

      - name: Black format cogs
        if: env.COGS_EXISTS == 'true'
        run: black $COGS_PATH

      - name: Black format tests
        if: env.TESTS_EXISTS == 'true'
        run: black $TESTS_PATH

      - name: Ruff autofix cogs
        if: env.COGS_EXISTS == 'true'
        run: ruff $COGS_PATH --fix

      - name: Ruff autofix tests
        if: env.TESTS_EXISTS == 'true'
        run: ruff $TESTS_PATH --fix

      - name: Commit & PR if changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style: auto fixes by black/ruff"
          branch: auto/fix-style
          title: "Auto formatting fixes"
          body: "Autofixes applied by black and ruff"
          labels: auto-fix, formatting

  issue-report:
    name: Issue Report for Errors or Skipped
    needs: quality-check
    runs-on: ubuntu-latest
    if: |
      needs.quality-check.outputs.ruff_errors != '' ||
      needs.quality-check.outputs.mypy_errors != '' ||
      needs.quality-check.outputs.tests_skipped == 'true'

    steps:
      - name: Create Issue From File
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "CI detected issues"
          content-filepath: ruff.txt
          labels: lint, ruff

      - name: Create Mypy Issue
        if: needs.quality-check.outputs.mypy_errors != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Type issues from mypy"
          content-filepath: mypy.txt
          labels: type-check, mypy

      - name: Notify skipped tests
        if: needs.quality-check.outputs.tests_skipped == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Tests skipped"
          content-filepath: audit.txt
          labels: ci-info