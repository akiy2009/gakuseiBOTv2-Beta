name: Python Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Run Ruff (Lint)
        id: ruff
        continue-on-error: true
        run: |
          if [ -d "cogs" ]; then
            ruff check cogs > ruff_output.txt || true
            cat ruff_output.txt
          fi

      - name: Run Mypy (Type Checking)
        id: mypy
        continue-on-error: true
        run: |
          if [ -d "cogs" ]; then
            mypy cogs > mypy_output.txt || true
            cat mypy_output.txt
          fi

      - name: Run pip-audit (Security)
        id: audit
        continue-on-error: true
        run: |
          pip-audit > audit_output.txt || true
          cat audit_output.txt

      - name: Run Pytest (Tests with Coverage)
        id: tests
        continue-on-error: true
        run: |
          if [ -d "tests" ]; then
            coverage run -m pytest || true
            coverage report || true
            coverage xml || true
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ruff_output.txt
            mypy_output.txt
            audit_output.txt

  auto-fix-and-report:
    runs-on: ubuntu-latest
    name: Auto Fix & PR/Issue
    needs: quality-checks

    env:
      TIMESTAMP: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters
        run: pip install black ruff

      - name: Run Black (auto-format)
        run: |
          if [ -d "cogs" ]; then
            black cogs tests || true
          else
            echo "No target directory for black"
          fi

      - name: Run Ruff Fix (auto-fix)
        run: |
          if [ -d "cogs" ]; then
            ruff check cogs tests --fix || true
          else
            echo "No target directory for ruff"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create unique branch from main
        run: |
          BRANCH="auto/format-fix-${TIMESTAMP}"
          git fetch origin main
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            git push origin --delete "$BRANCH"
          fi
          git checkout -b "$BRANCH" origin/main
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Commit changes if any
        id: commit
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "style: 自動整形による修正 (black/ruff)"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push new branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin "$BRANCH"

      - name: Create Pull Request for fixes
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: 自動整形 (black/ruff)"
          branch: ${{ env.BRANCH }}
          base: main
          title: "自動整形: black/ruff による修正"
          body: |
            GitHub Actions によって自動で作成された PR です。
            - `black` によるコード整形
            - `ruff` による Lint 修正
          labels: auto-fix, formatting
          delete-branch: false
          draft: false

      - name: Create Issues for Mypy / Audit / Ruff Errors
        if: steps.commit.outputs.changed == 'false'
        run: |
          mkdir -p .github/issues
          cat ruff_output.txt | grep -v "All checks passed" > .github/issues/ruff.txt || true
          cat mypy_output.txt | grep -v "Success:" > .github/issues/mypy.txt || true
          cat audit_output.txt > .github/issues/audit.txt || true

          for file in .github/issues/*.txt; do
            if [ -s "$file" ]; then
              issue_title="Code Quality Issue: $(basename "$file" .txt)"
              issue_body="$(cat $file)"
              gh issue create --title "$issue_title" --body "$issue_body" --label "ci-auto"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
