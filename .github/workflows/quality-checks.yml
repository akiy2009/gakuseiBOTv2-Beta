name: Python Quality CI with Auto PR Fix

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/quality-checks.yml'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-check:
    name: Quality Checks (Lint, Type, Test, Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Run ruff check (allow failures)
        run: |
          ruff check cogs tests || true

      - name: Run mypy
        run: mypy cogs

      - name: Security audit with pip-audit
        run: pip-audit

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

  auto-fix:
    name: Auto Format & PR Fixes
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: pip install black ruff

      - name: Apply black formatter
        run: black cogs tests

      - name: Apply ruff auto-fixes
        run: ruff cogs tests --fix

      - name: Check for changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style: automatic fixes by black and ruff"
            echo "CHANGES=1" >> $GITHUB_ENV
          else
            echo "CHANGES=0" >> $GITHUB_ENV
          fi

      - name: Create Pull Request if changes exist
        if: env.CHANGES == '1'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: automatic fixes by black and ruff"
          branch: auto/format-fix
          title: "Automatic style fixes"
          body: |
            This PR contains automatic code style fixes by black and ruff.
          labels: auto-fix, formatting
          delete-branch: true
