name: Python Quality CI

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/quality-checks.yml'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

jobs:
  quality-check:
    name: Quality Checks (Lint, Type, Test)
    runs-on: ubuntu-latest

    outputs:
      had_errors: ${{ steps.error-check.outputs.had_errors }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Check for cogs and tests folders
        id: check-folders
        run: |
          echo "COGS_EXISTS=$(if [ -d "cogs" ]; then echo true; else echo false; fi)" >> $GITHUB_ENV
          echo "TESTS_EXISTS=$(if [ -d "tests" ]; then echo true; else echo false; fi)" >> $GITHUB_ENV

      - name: Run ruff check
        if: env.COGS_EXISTS == 'true' || env.TESTS_EXISTS == 'true'
        continue-on-error: true
        id: ruff
        run: |
          ruff check cogs tests || echo "Ruff found issues."

      - name: Run mypy
        if: env.COGS_EXISTS == 'true'
        continue-on-error: true
        id: mypy
        run: |
          mypy cogs || echo "Mypy found issues."

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit

      - name: Run tests with coverage
        if: env.TESTS_EXISTS == 'true'
        continue-on-error: true
        id: pytest
        run: |
          coverage run -m pytest || echo "Pytest failed or no tests."
          coverage report || true
          coverage xml || true

      - name: Check for errors
        id: error-check
        run: |
          if [ "${{ steps.ruff.outcome }}" != "success" ] || [ "${{ steps.mypy.outcome }}" != "success" ] || [ "${{ steps.pytest.outcome }}" != "success" ]; then
            echo "had_errors=true" >> $GITHUB_OUTPUT
          else
            echo "had_errors=false" >> $GITHUB_OUTPUT
          fi

  auto-fix:
    name: Auto Format & PR
    runs-on: ubuntu-latest
    needs: quality-check

    if: needs.quality-check.outputs.had_errors == 'true' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters
        run: |
          pip install black ruff

      - name: Run black
        if: env.COGS_EXISTS == 'true' || env.TESTS_EXISTS == 'true'
        run: |
          if [ -d "cogs" ] || [ -d "tests" ]; then black cogs tests || true; fi

      - name: Run ruff fix
        if: env.COGS_EXISTS == 'true' || env.TESTS_EXISTS == 'true'
        run: |
          if [ -d "cogs" ] || [ -d "tests" ]; then ruff cogs tests --fix || true; fi

      - name: Check for changes
        id: git-check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || echo "CHANGED=true" >> $GITHUB_ENV

      - name: Create PR
        if: env.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: 自動整形による修正 (black/ruff)"
          branch: auto/format-fix
          title: "自動整形: black/ruff によるコード修正"
          body: |
            GitHub Actions により自動生成された PR です。
            - `black` による整形
            - `ruff --fix` による修正
          labels: auto-fix, formatting

  create-issues:
    name: Create Issues for Problems
    runs-on: ubuntu-latest
    needs: quality-check

    if: needs.quality-check.outputs.had_errors == 'true'

    steps:
      - name: Create Issue
        uses: peter-evans/create-issue@v4
        with:
          title: '[CI Warning] Lint/型チェック/テストでエラーが検出されました'
          body: |
            自動チェックにて以下の問題が検出されました。
            - Ruff (Lint)
            - Mypy (型チェック)
            - Pytest (ユニットテスト)

            詳細は最新の [GitHub Actions 実行ログ](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) をご確認ください。
          labels: bug, ci, auto-generated
