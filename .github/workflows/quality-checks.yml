name: Python Quality CI

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/quality-checks.yml'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

jobs:
  quality-check:
    name: Quality Checks (Lint, Type, Test, Audit)
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Lint チェック (ruff)
        run: |
          ruff check cogs tests

      - name: 型チェック (mypy)
        run: |
          mypy cogs

      - name: セキュリティスキャン (pip-audit)
        run: |
          pip-audit

      - name: ユニットテスト & カバレッジ
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

  auto-fix:
    name: Auto Format & PR
    runs-on: ubuntu-latest
    needs: quality-check  # Lint 等に失敗していても実行される

    if: github.ref == 'refs/heads/main'

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 整形ツールのインストール
        run: |
          pip install black ruff

      - name: black による自動整形
        run: |
          black cogs tests

      - name: ruff による整形（ルールベース）
        run: |
          ruff cogs tests --fix

      - name: Git 設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 自動修正 PR 作成
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: 自動整形による修正 (black/ruff)"
          branch: auto/format-fix
          title: "自動整形: black/ruff によるコード修正"
          body: |
            GitHub Actions によって自動で作成された PR です。
            - `black` によるコード整形
            - `ruff` による Lint/整形修正
          labels: auto-fix, formatting
