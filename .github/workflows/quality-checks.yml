name: Python Quality CI - Robust with Auto PR & Issue

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'cogs/**'
      - 'tests/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-check:
    name: Quality Checks (Lint, Type, Test, Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      # --- Check folder existence ---
      - name: Check if cogs folder exists
        id: check_cogs
        run: |
          if [ -d cogs ]; then
            echo "COGS_EXISTS=true" >> $GITHUB_ENV
          else
            echo "COGS_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Check if tests folder exists
        id: check_tests
        run: |
          if [ -d tests ]; then
            echo "TESTS_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TESTS_EXISTS=false" >> $GITHUB_ENV
          fi

      # --- Ruff lint on cogs and tests if exist ---
      - name: Ruff lint on cogs
        if: env.COGS_EXISTS == 'true'
        id: ruff_cogs
        run: |
          ruff check cogs > ruff_cogs.txt || true
          cat ruff_cogs.txt

      - name: Ruff lint on tests
        if: env.TESTS_EXISTS == 'true'
        id: ruff_tests
        run: |
          ruff check tests > ruff_tests.txt || true
          cat ruff_tests.txt

      # --- Mypy type check on cogs and tests if exist ---
      - name: Mypy type check on cogs
        if: env.COGS_EXISTS == 'true'
        id: mypy_cogs
        run: |
          mypy cogs > mypy_cogs.txt || true
          cat mypy_cogs.txt

      - name: Mypy type check on tests
        if: env.TESTS_EXISTS == 'true'
        id: mypy_tests
        run: |
          mypy tests > mypy_tests.txt || true
          cat mypy_tests.txt

      # --- Security audit ---
      - name: Security audit with pip-audit
        id: pip_audit
        run: |
          pip-audit > audit.txt || true
          cat audit.txt

      # --- Run tests with coverage if tests folder exists ---
      - name: Run tests with coverage
        if: env.TESTS_EXISTS == 'true'
        run: |
          coverage run -m pytest tests/
          coverage report
          coverage xml

      - name: Skip tests notice
        if: env.TESTS_EXISTS == 'false'
        run: echo "No tests folder found, skipping tests."

      # --- Save error flags to env ---
      - name: Parse lint errors flags
        run: |
          if [ -f ruff_cogs.txt ] && grep -qE "error|F401|F541" ruff_cogs.txt; then
            echo "RUFF_ERRORS=true" >> $GITHUB_ENV
          elif [ -f ruff_tests.txt ] && grep -qE "error|F401|F541" ruff_tests.txt; then
            echo "RUFF_ERRORS=true" >> $GITHUB_ENV
          else
            echo "RUFF_ERRORS=false" >> $GITHUB_ENV
          fi

          if [ -f mypy_cogs.txt ] && grep -q "error:" mypy_cogs.txt; then
            echo "MYPY_ERRORS=true" >> $GITHUB_ENV
          elif [ -f mypy_tests.txt ] && grep -q "error:" mypy_tests.txt; then
            echo "MYPY_ERRORS=true" >> $GITHUB_ENV
          else
            echo "MYPY_ERRORS=false" >> $GITHUB_ENV
          fi

          if grep -q "No known vulnerabilities found" audit.txt; then
            echo "AUDIT_ISSUES=false" >> $GITHUB_ENV
          else
            echo "AUDIT_ISSUES=true" >> $GITHUB_ENV
          fi

  auto-fix-pr:
    name: Auto Format and PR Creation
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: pip install black ruff

      - name: Run black formatter on cogs if exists
        if: env.COGS_EXISTS == 'true'
        run: black cogs

      - name: Run black formatter on tests if exists
        if: env.TESTS_EXISTS == 'true'
        run: black tests

      - name: Run ruff autofix on cogs if exists
        if: env.COGS_EXISTS == 'true'
        run: ruff cogs --fix

      - name: Run ruff autofix on tests if exists
        if: env.TESTS_EXISTS == 'true'
        run: ruff tests --fix

      - name: Check for changes
        id: check_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style: automatic fixes by black and ruff"
            echo "CHANGES=1" >> $GITHUB_ENV
          else
            echo "CHANGES=0" >> $GITHUB_ENV
          fi

      - name: Create Pull Request if fixes applied
        if: env.CHANGES == '1'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: automatic fixes by black and ruff"
          branch: auto/format-fix
          title: "Automatic style fixes"
          body: |
            This PR contains automatic code style fixes by black and ruff.
          labels: auto-fix, formatting
          delete-branch: true

  issue-report:
    name: Create Issues for Remaining Errors or Skipped Steps
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Create Ruff Issue
        if: env.RUFF_ERRORS == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: '[Lint Error] Ruff detected code issues'
          content-filepath: ruff_cogs.txt
          labels: lint, ruff
          assignees: akiy2009

      - name: Create Mypy Issue
        if: env.MYPY_ERRORS == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: '[Type Error] Mypy detected typing issues'
          content-filepath: mypy_cogs.txt
          labels: type-check, mypy
          assignees: your-github-username

      - name: Create Security Audit Issue
        if: env.AUDIT_ISSUES == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: '[Security] Vulnerabilities detected by pip-audit'
          content-filepath: audit.txt
          labels: security, audit
          assignees: akiy2009

      - name: Create Issue for Missing cogs Folder
        if: env.COGS_EXISTS == 'false'
        uses: peter-evans/create-issue@v3
        with:
          title: '[Info] cogs フォルダが見つかりませんでした'
          body: |
            このリポジトリには `cogs` フォルダが存在しなかったため、
            Lint・型チェック・自動整形処理はスキップされました。
          labels: info
          assignees: akiy2009

      - name: Create Issue for Missing tests Folder
        if: env.TESTS_EXISTS == 'false'
        uses: peter-evans/create-issue@v3
        with:
          title: '[Info] tests フォルダが見つかりませんでした'
          body: |
            このリポジトリには `tests` フォルダが存在しなかったため、
            テスト実行およびカバレッジ計測処理はスキップされました。
          labels: info
          assignees: akiy2009
