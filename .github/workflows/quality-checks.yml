name: Python Quality CI – Auto Fix & Reporting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      ruff_errors: ${{ steps.ruff.outputs.errors }}
      mypy_errors: ${{ steps.mypy.outputs.errors }}
      tests_skipped: ${{ steps.check_tests.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install ruff black mypy pytest coverage pip-audit

      - name: Check existence of cogs folder
        id: check_cogs
        run: |
          echo "cogs_exists=$(if [ -d cogs ]; then echo true; else echo false; fi)" >> $GITHUB_ENV

      - name: Check existence of tests folder
        id: check_tests
        run: |
          echo "tests_exists=$(if [ -d tests ]; then echo true; else echo false; fi)" >> $GITHUB_ENV

      - name: Run ruff check
        id: ruff
        run: |
          ERR=$(if [ "${{ env.cogs_exists }}" = "true" ]; then ruff check cogs || true; fi)
          echo "$ERR" | tee ruff.txt
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          echo "$ERR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run mypy
        id: mypy
        run: |
          ERR=$(if [ "${{ env.cogs_exists }}" = "true" ]; then mypy cogs || true; fi)
          echo "$ERR" | tee mypy.txt
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          echo "$ERR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run pytest
        id: pytest-run
        run: |
          if [ "${{ env.tests_exists }}" = "true" ]; then
            coverage run -m pytest || true
            coverage report || true
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

  auto_fix:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatting tools
        run: pip install black ruff

      - name: Apply black and ruff fixes
        run: |
          if [ "${{ env.cogs_exists }}" = "true" ]; then
            black cogs && ruff cogs --fix || true
          fi

      - name: Commit & PR if fixes detected
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style: auto-format by black and ruff"
          branch: auto/fix-style
          title: "Auto format fixes"
          body: "Automatically formatted by black and ruff"
          labels: auto-fix, formatting

  issue_report:
    needs: quality
    runs-on: ubuntu-latest
    if: ${{ needs.quality.outputs.ruff_errors != '' || needs.quality.outputs.mypy_errors != '' || needs.quality.outputs.tests_skipped == 'true' }}
    steps:
      - name: Create issue from lint
        if: ${{ needs.quality.outputs.ruff_errors != '' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Lint issues detected by ruff"
          content-filepath: ruff.txt
          labels: lint

      - name: Create issue from mypy
        if: ${{ needs.quality.outputs.mypy_errors != '' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Type issues detected by mypy"
          content-filepath: mypy.txt
          labels: type-check

      - name: Notify test skip
        if: ${{ needs.quality.outputs.tests_skipped == 'true' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Tests folder missing, tests skipped"
          content-filepath: ruff.txt
          labels: ci-info