name: Python Quality CI

on:
  push:
    branches: [main]
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/quality-checks.yml'
  pull_request:
    paths:
      - 'cogs/**/*.py'
      - 'tests/**/*.py'

env:
  COGS_PATH: cogs
  TESTS_PATH: tests

jobs:
  quality-check:
    name: 静的チェック & テスト
    runs-on: ubuntu-latest
    outputs:
      ruff_errors: ${{ steps.ruff-check.outputs.errors }}
      mypy_errors: ${{ steps.mypy-check.outputs.errors }}
      test_skipped: ${{ steps.pytest-check.outputs.skipped }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: フォルダ存在チェック
        id: check-paths
        run: |
          echo "COGS_EXISTS=$(if [ -d "${{ env.COGS_PATH }}" ]; then echo true; else echo false; fi)" >> $GITHUB_ENV
          echo "TESTS_EXISTS=$(if [ -d "${{ env.TESTS_PATH }}" ]; then echo true; else echo false; fi)" >> $GITHUB_ENV

      - name: Ruff チェック
        id: ruff-check
        if: env.COGS_EXISTS == 'true'
        run: |
          ERRORS=$(ruff check ${{ env.COGS_PATH }} ${{ env.TESTS_PATH }} || true)
          echo "$ERRORS"
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          echo "$ERRORS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Mypy チェック
        id: mypy-check
        if: env.COGS_EXISTS == 'true'
        run: |
          ERRORS=$(mypy ${{ env.COGS_PATH }} || true)
          echo "$ERRORS"
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          echo "$ERRORS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: セキュリティスキャン
        if: env.COGS_EXISTS == 'true'
        run: pip-audit || true

      - name: ユニットテスト & カバレッジ
        id: pytest-check
        if: env.TESTS_EXISTS == 'true'
        run: |
          coverage run -m pytest || true
          coverage report || true
          coverage xml || true
          echo "skipped=false" >> $GITHUB_OUTPUT

      - name: テストスキップ
        if: env.TESTS_EXISTS != 'true'
        run: echo "skipped=true" >> $GITHUB_OUTPUT

  auto-fix:
    name: 自動整形 & PR 提出
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 整形ツールインストール
        run: pip install black ruff

      - name: Black 自動整形
        if: env.COGS_EXISTS == 'true'
        run: |
          if [ -d "${{ env.COGS_PATH }}" ]; then black ${{ env.COGS_PATH }}; fi
          if [ -d "${{ env.TESTS_PATH }}" ]; then black ${{ env.TESTS_PATH }}; fi

      - name: Ruff 自動整形
        if: env.COGS_EXISTS == 'true'
        run: |
          if [ -d "${{ env.COGS_PATH }}" ]; then ruff ${{ env.COGS_PATH }} --fix; fi
          if [ -d "${{ env.TESTS_PATH }}" ]; then ruff ${{ env.TESTS_PATH }} --fix; fi

      - name: Git 設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: PR を自動作成
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "style: 自動整形 (black / ruff)"
          branch: auto/fix-style
          title: "自動整形: black / ruff による修正"
          body: |
            自動整形ツールによって生成された PR です。
            - `black`: Python コード整形
            - `ruff`: Lint 自動修正
          labels: auto-fix, style

  report-issues:
    name: 問題の Issue 報告
    needs: quality-check
    runs-on: ubuntu-latest
    if: |
      needs.quality-check.outputs.ruff_errors != '' ||
      needs.quality-check.outputs.mypy_errors != '' ||
      needs.quality-check.outputs.test_skipped == 'true'

    steps:
      - name: ✉️ Issue 作成
        uses: peter-evans/create-issue@v2
        with:
          title: "自動チェックでの問題検出"
          body: |
            自動チェックで以下の問題が検出されました。

            ### Ruff Lint エラー
            ```
            ${{ needs.quality-check.outputs.ruff_errors }}
            ```

            ### Mypy 型チェックエラー
            ```
            ${{ needs.quality-check.outputs.mypy_errors }}
            ```

            ### テスト実行
            - ステータス: ${{ needs.quality-check.outputs.test_skipped == 'true' && 'スキップ (tests フォルダなし)' || '実行済み' }}

            必要に応じて修正対応をお願いします。
          labels: bug, lint, ci