name: Python Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black ruff mypy flake8 pytest coverage pip-audit

      - name: Run Ruff (Lint)
        continue-on-error: true
        run: |
          if [ -d "cogs" ]; then
            ruff check cogs > ruff_output.txt || true
            cat ruff_output.txt
          fi

      - name: Run Mypy (Type Checking)
        continue-on-error: true
        run: |
          if [ -d "cogs" ]; then
            mypy cogs > mypy_output.txt || true
            cat mypy_output.txt
          fi

      - name: Run pip-audit (Security)
        continue-on-error: true
        run: |
          pip-audit > audit_output.txt || true
          cat audit_output.txt

      - name: Run Pytest (Tests with Coverage)
        continue-on-error: true
        run: |
          if [ -d "tests" ]; then
            coverage run -m pytest || true
            coverage report || true
            coverage xml || true
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: |
            ruff_output.txt
            mypy_output.txt
            audit_output.txt

  auto-fix-and-report:
    runs-on: ubuntu-latest
    needs: quality-checks
    name: Auto Fix & PR/Issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install black ruff gh

      - name: Download logs
        uses: actions/download-artifact@v4
        with:
          name: quality-logs

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate unique branch name
        id: branch_name
        run: echo "value=auto/format-fix-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create new branch from main
        run: |
          git checkout origin/main
          git switch -c "${{ steps.branch_name.outputs.value }}"

      - name: Run formatters (black, ruff)
        run: |
          if [ -d "cogs" ]; then
            black cogs tests || true
            ruff check cogs tests --fix || true
          fi

      - name: Commit changes if any
        id: commit
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "style: 自動整形による修正 (black/ruff)"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin "${{ steps.branch_name.outputs.value }}"

      - name: Create Pull Request
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch_name.outputs.value }}
          base: main
          title: "自動整形: black/ruff による修正"
          body: |
            GitHub Actions によって自動で作成された PR です。
            - `black` によるコード整形
            - `ruff` による Lint 修正
          commit-message: "style: 自動整形 (black/ruff)"
          labels: auto-fix, formatting
          delete-branch: false
          draft: false

      - name: Create GitHub Issues for static analysis errors
        if: steps.commit.outputs.changed == 'false'
        run: |
          mkdir -p .github/issues
          grep -v "All checks passed" ruff_output.txt > .github/issues/ruff.txt || true
          grep -v "Success:" mypy_output.txt > .github/issues/mypy.txt || true
          cat audit_output.txt > .github/issues/audit.txt || true

          for file in .github/issues/*.txt; do
            if [ -s "$file" ]; then
              title="Code Quality Issue: $(basename "$file" .txt)"
              body=$(cat "$file")
              gh issue create --title "$title" --body "$body" --label ci-auto
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}