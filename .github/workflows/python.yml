name: Houston - Run main.py on Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  run-main:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: main.py の実行
        run: |
          python main.py
          
      - name: 成功を Issues に通知
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "main.py 実行成功" \
                          --body "Houston の main.py の実行が成功しました。（$(date +'%Y-%m-%d %H:%M:%S')）"        
